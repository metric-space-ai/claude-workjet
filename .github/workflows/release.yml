name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight release inputs
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.WORKJET_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WORKJET_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.WORKJET_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.WORKJET_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.WORKJET_NOTARY_ISSUER_ID }}
          SIGNING_IDENTITY: ${{ vars.WORKJET_SIGNING_IDENTITY }}
        run: |
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$NOTARY_KEY_BASE64"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
          test -n "$SIGNING_IDENTITY"
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Info.plist)
          test "$version" = "$app_version"
          git show-ref --verify --quiet "refs/tags/$GITHUB_REF_NAME"

      - name: Install release build dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install librsvg

      - name: Import temporary signing credentials
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.WORKJET_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WORKJET_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.WORKJET_NOTARY_KEY_BASE64 }}
          WORKJET_SIGNING_IDENTITY: ${{ vars.WORKJET_SIGNING_IDENTITY }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/workjet-release.keychain-db"
          password_file="$RUNNER_TEMP/workjet-keychain-password"
          security list-keychains -d user > "$RUNNER_TEMP/workjet-original-keychains"
          openssl rand -hex 32 > "$password_file"
          printf '%s' "$CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/workjet-release.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$(cat "$password_file")" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$(cat "$password_file")" "$keychain"
          security import "$RUNNER_TEMP/workjet-release.p12" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$(cat "$password_file")" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$WORKJET_SIGNING_IDENTITY"

      - name: Build, sign, notarize, and staple
        env:
          WORKJET_REQUIRE_RELEASE_SIGNING: "1"
          WORKJET_SIGNING_IDENTITY: ${{ vars.WORKJET_SIGNING_IDENTITY }}
          WORKJET_NOTARY_KEY_ID: ${{ secrets.WORKJET_NOTARY_KEY_ID }}
          WORKJET_NOTARY_ISSUER_ID: ${{ secrets.WORKJET_NOTARY_ISSUER_ID }}
          WORKJET_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: ./app/build-app.sh

      - name: Verify signed and notarized app
        env:
          WORKJET_SIGNING_IDENTITY: ${{ vars.WORKJET_SIGNING_IDENTITY }}
        run: |
          app="app/dist/Workjet.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F -- "Authority=$WORKJET_SIGNING_IDENTITY"
          test "$(lipo -archs "$app/Contents/MacOS/WorkjetApp")" = arm64
          test "$(lipo -archs "$app/Contents/MacOS/workjet")" = arm64
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Inspect archive and create checksum
        env:
          WORKJET_SIGNING_IDENTITY: ${{ vars.WORKJET_SIGNING_IDENTITY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="Workjet-$version-macos-arm64"
          archive="app/dist/$root.zip"
          inspect="$RUNNER_TEMP/archive-inspection"
          test -s "$archive"
          unzip -t "$archive"
          ARCHIVE="$archive" EXPECTED_ROOT="$root" python3 - <<'PY'
          import os
          import pathlib
          import stat
          import zipfile

          archive = os.environ["ARCHIVE"]
          expected = os.environ["EXPECTED_ROOT"] + "/"
          with zipfile.ZipFile(archive) as zipped:
              if not zipped.infolist():
                  raise SystemExit("archive is empty")
              for entry in zipped.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {entry.filename}")
                  if any(part == "__MACOSX" or part.startswith("._") for part in path.parts):
                      raise SystemExit(f"AppleDouble metadata is forbidden: {entry.filename}")
                  if not entry.filename.startswith(expected):
                      raise SystemExit(f"unexpected archive root: {entry.filename}")
                  if stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit(f"archive symlink: {entry.filename}")
          PY
          rm -rf "$inspect"
          mkdir -p "$inspect"
          ditto -x -k "$archive" "$inspect"
          test "$(find "$inspect" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 1
          test -d "$inspect/$root/Workjet.app"
          test -x "$inspect/$root/install.sh"
          test "$(find "$inspect/$root" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 2
          test -z "$(find "$inspect/$root" -type l -print -quit)"
          test -z "$(find "$inspect/$root" \( -name '._*' -o -name '__MACOSX' \) -print -quit)"
          codesign --verify --deep --strict --verbose=4 "$inspect/$root/Workjet.app"
          codesign -dv --verbose=4 "$inspect/$root/Workjet.app" 2>&1 | grep -F -- "Authority=$WORKJET_SIGNING_IDENTITY"
          xcrun stapler validate "$inspect/$root/Workjet.app"
          spctl --assess --type execute --verbose=4 "$inspect/$root/Workjet.app"
          (cd app/dist && shasum -a 256 "$root.zip" > "$root.zip.sha256")
          shasum -a 256 -c "app/dist/$root.zip.sha256"

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workjet-release-${{ github.ref_name }}
          path: |
            app/dist/Workjet-*-macos-arm64.zip
            app/dist/Workjet-*-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing credentials
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/workjet-original-keychains"; then
            keychains=()
            while IFS= read -r line; do
              path="${line#*\"}"
              path="${path%\"*}"
              if test -n "$path"; then keychains+=("$path"); fi
            done < "$RUNNER_TEMP/workjet-original-keychains"
            if test "${#keychains[@]}" -gt 0; then
              security list-keychains -d user -s "${keychains[@]}" || true
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/workjet-release.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/workjet-release.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/workjet-keychain-password" \
            "$RUNNER_TEMP/workjet-original-keychains"
          rm -rf "$RUNNER_TEMP/archive-inspection" app/.build app/dist

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workjet-release-${{ github.ref_name }}
          path: release-assets

      - name: Verify downloaded assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="Workjet-$version-macos-arm64"
          test -s "release-assets/$root.zip"
          test -s "release-assets/$root.zip.sha256"
          test "$(find release-assets -maxdepth 1 -type f -print | wc -l | tr -d ' ')" = 2
          (cd release-assets && sha256sum -c "$root.zip.sha256")
          unzip -t "release-assets/$root.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="Workjet-$version-macos-arm64"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/$root.zip" \
            "release-assets/$root.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Workjet $version" \
            --generate-notes

      - name: Clean downloaded assets
        if: always()
        run: rm -rf release-assets
